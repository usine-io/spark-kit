# deploy/compose.yml — source unique de la stack Spark (bac a sable macOS et production Linux).
#
# Copie dans infra/ par les guides : `cp deploy/compose.yml infra/compose.yml`.
# Les chemins relatifs (./config/..., ./apps) supposent l'arborescence infra/ des guides :
#   infra/compose.yml, infra/.env, infra/config/{caddy,postgres}/, infra/apps/.
#
# Toutes les images sont figees par tag ET digest (releves par deploy/scripts/pin-digests.sh).
# Ne JAMAIS remplacer un tag par :latest : un pull surprise = migration de schema sans
# retour arriere, et une restauration exige la meme version que la source.
# Montee de version = modifier ce fichier volontairement, puis relancer pin-digests.sh,
# puis suivre la fiche correspondante d'UPGRADES.md (banc sur copie, retour arriere ecrit).
#
# Profils (COMPOSE_PROFILES dans .env, ou `docker compose --profile <nom>`) :
#   tunnel   cloudflared en conteneur (defaut des guides a l'etape 4 ; sans lui, rien n'est expose)
#   runners  task runner n8n externe (sidecar), AVEC l'override compose.runners.yml
# Sans profil, `docker compose up -d` demarre postgres, n8n, nocodb et caddy, rien d'autre.
name: spark

# Journaux des conteneurs bornes : un service bavard ne remplit pas le disque.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    image: postgres:16.16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    <<: *logging
    restart: unless-stopped
    # Plafond memoire : sans lui, c'est Postgres que le noyau tue en premier quand un autre
    # service deborde (vecu). A dimensionner avec shared_buffers (lot PostgreSQL 18 : reglages
    # `command`). 512 Mo tiennent une stack Spark de depart ; plus si la base metier grossit.
    mem_limit: ${PG_MEM_LIMIT:-512m}
    shm_size: 256m
    networks: [spark]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_DB: postgres
      # Lus par init-db.sh au PREMIER demarrage seulement (volume vide).
      # Changer un mot de passe ensuite = ALTER USER ... PASSWORD, puis mettre le .env a jour.
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      NOCODB_DB_PASSWORD: ${NOCODB_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  n8n:
    image: n8nio/n8n:2.49.6@sha256:a1a9955a4a9e5dd9fa65a62f59e0751351b45b9e5cd2c17e6e330a8d0026cad8
    <<: *logging
    restart: unless-stopped
    # Sans plafond, une rafale pousse n8n a evincer Postgres (OOM repetes, vecu chez une PME).
    # Regle de dimensionnement : N8N_HEAP_MB + N8N_RUNNERS_HEAP_MB + ~200 Mo <= N8N_MEM_LIMIT
    # (en mode runner interne, le runner vit dans le meme cgroup que n8n). 1 Go est le minimum,
    # 1,5 Go conseille sur un serveur de 8 Go. Le sidecar (profil runners) decouple les deux.
    mem_limit: ${N8N_MEM_LIMIT:-1g}
    networks: [spark]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_HOST: ${SPARK_PREFIX}-n8n.${SPARK_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${SPARK_PREFIX}-n8n.${SPARK_DOMAIN}/
      # N8N_WEBHOOK_URL remplace WEBHOOK_URL (depreciee en 2.4x : avertissement au demarrage) et
      # couvre les webhooks de test comme de production.
      N8N_WEBHOOK_URL: https://${SPARK_PREFIX}-app.${SPARK_DOMAIN}/
      # Sauts de proxy entre le client et n8n (Express `trust proxy`). Chemin de production :
      # Cloudflare (ecrit l'IP du client dans X-Forwarded-For) -> cloudflared -> Caddy (ajoute un
      # saut) -> n8n : 2. Mesure derriere Caddy seul (UPGRADES.md, fiche n8n) : avec 1, n8n voit
      # l'IP TCP du client de Caddy et ignore un X-Forwarded-For forge ; avec 2, il prend la valeur
      # de l'en-tete. Caddy n'etant joignable que par le tunnel (127.0.0.1), 2 est la valeur du kit ;
      # une valeur trop basse donne la meme IP (celle de cloudflared) a tous les utilisateurs et
      # fausse le limiteur de connexions (vecu).
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-2}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      NODE_ENV: production
      GENERIC_TIMEZONE: ${SPARK_TZ:-Europe/Paris}
      TZ: ${SPARK_TZ:-Europe/Paris}
      # Telemetrie et bruit
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      # Module insights : un workflow execute puis supprime en moins de 30 s empoisonne son tampon
      # et n8n ralentit chaque jour (vecu). Inutile sur un site Spark. Attention au retour arriere :
      # une version qui ne connait pas un module liste ici refuse de demarrer (UPGRADES.md).
      N8N_DISABLED_MODULES: insights
      # Retention des executions : execution_data representait l'essentiel de la base n8n (vecu).
      # 7 jours ou 150 000 executions, le premier atteint. `saveDataSuccessExecution: none` par
      # workflow sur les GET a fort volume.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "150000"
      # Tas Node borne SOUS mem_limit (sinon le cgroup tue le processus avant que V8 ne collecte).
      NODE_OPTIONS: "--max-old-space-size=${N8N_HEAP_MB:-640}"
      # Task runners (toujours actifs en 2.x). Mode interne par defaut : le runner est un processus
      # enfant dans le meme cgroup, avec son propre plafond de tas. Mode externe = profil runners
      # + override compose.runners.yml (banc dans UPGRADES.md). La valeur ci-dessous est posee
      # pour etre lue, c'est le defaut de n8n 2.49.
      N8N_RUNNERS_MODE: internal
      N8N_RUNNERS_MAX_OLD_SPACE_SIZE: ${N8N_RUNNERS_HEAP_MB:-192}
      # Delai d'une tache du runner, en secondes, fige explicitement (le defaut peut changer
      # d'une version a l'autre : 60 s en 2.49).
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      # Durcissement 2.x (deja les defauts, ecrits pour etre lus et conserves)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger"]'
      # Pas de paquets communautaires non verifies (le defaut passe a false en 3.x : fige des maintenant).
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      # Limites du node Compression figees aux valeurs que la 3.x imposera (256 Mio, 1000 entrees) :
      # un site qui en a besoin de plus le fait volontairement, dans son .env, et le sait.
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      # NE PAS poser N8N_CONCURRENCY_PRODUCTION_LIMIT sans banc : en mode regular une valeur
      # basse a bloque tous les webhooks (vecu) ; la contre-pression reelle = mode queue.
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      # /healthz repond 200 avec une base morte : toujours /healthz/readiness.
      # start_period long : les migrations d'une montee prennent de l'ordre d'une minute, et
      # redemarrer pendant est le pire choix. node est toujours present dans l'image, pas wget.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s

  # --- Task runner externe (profil `runners`, option bancee ; obligatoire en n8n 3.x) ---------
  # A lancer AVEC l'override qui bascule n8n en mode externe :
  #   docker compose -f compose.yml -f compose.runners.yml --profile runners up -d
  # (ou COMPOSE_PROFILES=runners et COMPOSE_FILE=compose.yml:compose.runners.yml dans .env).
  # Meme version que n8n, toujours : les deux tags changent ensemble.
  runners:
    image: n8nio/runners:2.49.6@sha256:dde28472eab4e118119d44bedad2561ab40fad6a208bbaeec664f3caad8b2bc8
    <<: *logging
    profiles: [runners]
    restart: unless-stopped
    mem_limit: ${N8N_RUNNERS_MEM_LIMIT:-512m}
    networks: [spark]
    depends_on:
      - n8n
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_MAX_OLD_SPACE_SIZE: ${N8N_RUNNERS_HEAP_MB:-192}
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      GENERIC_TIMEZONE: ${SPARK_TZ:-Europe/Paris}

  nocodb:
    image: nocodb/nocodb:2026.04.5@sha256:4498ea3612227f43842468033e27661ff3db4775a5cbc40399695198329ee2b2
    <<: *logging
    restart: unless-stopped
    mem_limit: 900m
    networks: [spark]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # NC_DB_JSON (objet) et non NC_DB (URL) : un mot de passe avec caracteres speciaux
      # ferait boucler le service.
      NC_DB_JSON: '{"client":"pg","connection":{"host":"postgres","port":5432,"user":"nocodb","password":"${NOCODB_DB_PASSWORD}","database":"nocodb"}}'
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
      NC_PUBLIC_URL: https://${SPARK_PREFIX}-db.${SPARK_DOMAIN}
    volumes:
      - nocodb_data:/usr/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    <<: *logging
    restart: unless-stopped
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    networks: [spark]
    ports:
      # 127.0.0.1 uniquement : tout entre par le tunnel. Sans ce prefixe, Caddy est sur le LAN.
      - "127.0.0.1:${SPARK_HOST_HTTP_PORT:-18080}:80"
    environment:
      SPARK_DOMAIN: ${SPARK_DOMAIN}
      SPARK_PREFIX: ${SPARK_PREFIX}
    volumes:
      # Le REPERTOIRE est monte, pas le fichier : on peut remplacer le Caddyfile, poser un fichier
      # dans sites.d/ ou le drapeau MAINTENANCE sans le piege de l'inode (un fichier monte puis
      # remplace par mv devient invisible au conteneur). Contenu : Caddyfile, sites.d/*.caddy,
      # MAINTENANCE (page 503 sur tous les vhosts tant qu'il existe, voir UPGRADES.md).
      - ./config/caddy:/etc/caddy:ro
      - ./apps:/srv/apps:ro
      - caddy_data:/data
      - caddy_config:/config
      # Journal d'acces JSON (snippet `securite` du Caddyfile) : endpoint x referer x utilisateur
      # a deja localise des tempetes de requetes (vecu).
      - caddy_logs:/var/log/caddy
    depends_on:
      - n8n
      - nocodb
    healthcheck:
      # Sonde un vhost reel, avec Host, et le CORPS de la reponse : un Host inconnu rend 404 depuis
      # ce lot, mais un 200 seul ne prouverait pas le routage. Caddy est donc « unhealthy » tant
      # que n8n n'est pas pret (start_period couvre les migrations) : c'est voulu, c'est l'etat
      # du site vu de l'exterieur. L'image alpine embarque wget (busybox).
      test: ["CMD-SHELL", "wget -qO- --header \"Host: ${SPARK_PREFIX}-n8n.${SPARK_DOMAIN}\" http://127.0.0.1/healthz/readiness | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 150s

  # --- Tunnel Cloudflare en conteneur (profil `tunnel`) ------------------------------------------
  # Demarre seulement avec le profil (COMPOSE_PROFILES=tunnel dans .env a l'etape 4 des guides) :
  # sans jeton ni identifiants de tunnel, il n'a rien a faire et ne doit pas tourner.
  # Variante « cloudflared sur l'hote » : deploy/linux/systemd/spark-cloudflared.service (Linux)
  # ou deploy/macos/launchd/com.spark.cloudflared.plist (macOS), fiche de bascule dans UPGRADES.md.
  cloudflared:
    image: cloudflare/cloudflared:2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
    <<: *logging
    profiles: [tunnel]
    # always, pas unless-stopped : coupe du reseau il reste « vivant » et se reconnecte seul ; un
    # arret manuel (`docker compose stop cloudflared`) coupe le site, il ne doit pas survivre a
    # un redemarrage du demon Docker par accident.
    restart: always
    mem_limit: 128m
    networks: [spark]
    # L'image tourne en utilisateur non root (65532) et sans shell. `user:` la fait tourner sous
    # l'utilisateur hote qui possede le repertoire des identifiants (SPARK_UID/SPARK_GID, poses par
    # init-env.sh) : les fichiers 600 de `cloudflared tunnel create` restent lisibles sans chown.
    user: "${SPARK_UID:-65532}:${SPARK_GID:-65532}"
    # config.yml : ecrit par deploy/scripts/tunnel-config.sh (ingress vers http://caddy:80, jamais
    # le port hote, invisible depuis le conteneur ; credentials-file sous /etc/cloudflared/).
    # --no-autoupdate : la version est celle du tag, une montee est volontaire (UPGRADES.md).
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml --metrics 0.0.0.0:2000 run
    ports:
      # /ready et /metrics pour les sondes locales (le conteneur n'est pas resolvable depuis l'hote).
      - "127.0.0.1:${SPARK_TUNNEL_METRICS_PORT:-2000}:2000"
    volumes:
      - ${SPARK_TUNNEL_DIR:-./cloudflared}:/etc/cloudflared:ro
    depends_on:
      - caddy
    # Pas de healthcheck compose (image sans shell) : la sonde est `curl http://127.0.0.1:2000/ready`
    # cote hote, corps avec `"readyConnections":N` (N > 0).

volumes:
  postgres_data:
  n8n_data:
  nocodb_data:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  spark:
    driver: bridge
