# deploy/compose.yml — source unique de la stack Spark (bac a sable macOS et production Linux).
#
# Copie dans infra/ par les guides : `cp deploy/compose.yml infra/compose.yml`.
# Les chemins relatifs (./config/..., ./apps) supposent l'arborescence infra/ des guides :
#   infra/compose.yml, infra/.env, infra/config/{caddy,postgres}/, infra/apps/.
#
# Toutes les images sont figees par tag ET digest (releves par deploy/scripts/pin-digests.sh).
# Ne JAMAIS remplacer un tag par :latest : un pull surprise = migration de schema sans
# retour arriere, et une restauration exige la meme version que la source.
# Montee de version = modifier ce fichier volontairement, puis relancer pin-digests.sh.
name: spark

services:
  postgres:
    image: postgres:16.16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    networks: [spark]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_DB: postgres
      # Lus par init-db.sh au PREMIER demarrage seulement (volume vide).
      # Changer un mot de passe ensuite = ALTER USER ... PASSWORD, puis mettre le .env a jour.
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      NOCODB_DB_PASSWORD: ${NOCODB_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:2.19.4@sha256:c628aa44f1cc3de51f81b3a2b31ca1fa95de20638379e257330e575388964faf
    restart: unless-stopped
    # Sans plafond, une rafale d'imports peut pousser un service a evincer les autres
    # (incidents OOM vecus chez une PME). Ajuster a la RAM du serveur, mais toujours en poser un.
    mem_limit: 1g
    networks: [spark]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_HOST: ${SPARK_PREFIX}-n8n.${SPARK_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${SPARK_PREFIX}-n8n.${SPARK_DOMAIN}/
      WEBHOOK_URL: https://${SPARK_PREFIX}-app.${SPARK_DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_USER_MANAGEMENT_DISABLED: "false"
      NODE_ENV: production
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
    volumes:
      - n8n_data:/home/node/.n8n

  nocodb:
    image: nocodb/nocodb:2026.04.5@sha256:4498ea3612227f43842468033e27661ff3db4775a5cbc40399695198329ee2b2
    restart: unless-stopped
    mem_limit: 900m
    networks: [spark]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # NC_DB_JSON (objet) et non NC_DB (URL) : un mot de passe avec caracteres speciaux
      # ferait boucler le service.
      NC_DB_JSON: '{"client":"pg","connection":{"host":"postgres","port":5432,"user":"nocodb","password":"${NOCODB_DB_PASSWORD}","database":"nocodb"}}'
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
      NC_PUBLIC_URL: https://${SPARK_PREFIX}-db.${SPARK_DOMAIN}
    volumes:
      - nocodb_data:/usr/app/data

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    networks: [spark]
    ports:
      # 127.0.0.1 uniquement : tout entre par le tunnel. Sans ce prefixe, Caddy est sur le LAN.
      - "127.0.0.1:${SPARK_HOST_HTTP_PORT:-18080}:80"
    environment:
      SPARK_DOMAIN: ${SPARK_DOMAIN}
      SPARK_PREFIX: ${SPARK_PREFIX}
    volumes:
      # Le REPERTOIRE est monte, pas le fichier : on peut remplacer le Caddyfile ou poser un
      # fichier dans sites.d/ sans le piege de l'inode (un fichier monte puis remplace par mv
      # devient invisible au conteneur). Contenu : Caddyfile, sites.d/*.caddy.
      - ./config/caddy:/etc/caddy:ro
      - ./apps:/srv/apps:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
      - nocodb

volumes:
  postgres_data:
  n8n_data:
  nocodb_data:
  caddy_data:
  caddy_config:

networks:
  spark:
    driver: bridge
